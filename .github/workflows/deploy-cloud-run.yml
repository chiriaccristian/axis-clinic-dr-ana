name: Deploy API to Cloud Run

# develop -> GitHub environment "test" (crm-test.drana.ro)
# main    -> GitHub environment "production" (crm.drana.ro)
# Each environment holds the variables of its own Google Cloud project.
# Setup steps: deploy/cloud-run/README.md

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'api' }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$PROJECT_ID" ] || [ -z "${{ vars.GCP_WIF_PROVIDER }}" ] || [ -z "${{ vars.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "::notice::Google Cloud is not configured for this environment yet. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - name: Authenticate to Google Cloud
        if: steps.config.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.config.outputs.ready == 'true'

      - name: Build and push image
        if: steps.config.outputs.ready == 'true'
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/api/$SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f deploy/cloud-run/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Database and file storage, once deploy/cloud-run/README.md
      # ("Database and medical files") has been run for this project.
      - name: Data configuration
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_IAM_USER: ${{ vars.DB_IAM_USER }}
          MEDIA_BUCKET: ${{ vars.MEDIA_BUCKET }}
          RUNTIME_SA: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
        run: |
          FLAGS=""
          ENV_VARS=""
          if [ -n "$RUNTIME_SA" ]; then
            FLAGS="$FLAGS --service-account=$RUNTIME_SA"
          fi
          if [ -n "$CLOUD_SQL_INSTANCE" ]; then
            FLAGS="$FLAGS --add-cloudsql-instances=$CLOUD_SQL_INSTANCE"
            ENV_VARS="CLOUD_SQL_INSTANCE=$CLOUD_SQL_INSTANCE,DB_NAME=$DB_NAME,DB_IAM_USER=$DB_IAM_USER"
          fi
          if [ -n "$MEDIA_BUCKET" ]; then
            ENV_VARS="${ENV_VARS:+$ENV_VARS,}MEDIA_BUCKET=$MEDIA_BUCKET"
          fi
          if [ -n "$ENV_VARS" ]; then
            FLAGS="$FLAGS --update-env-vars=$ENV_VARS"
          fi
          echo "DATA_FLAGS=$FLAGS" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        if: steps.config.outputs.ready == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: --port=8080 --min-instances=0 --max-instances=3 --memory=512Mi ${{ env.DATA_FLAGS }}
